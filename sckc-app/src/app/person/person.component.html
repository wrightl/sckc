<mat-card class="person-card" appearance="outlined">
  <div class="person-photo">
    @if (person.imageUrl) {
      <img [src]="person.imageUrl" [alt]="person.name" loading="lazy" />
    }
  </div>

  <mat-card-content class="person-body">
    <h2 class="person-name">{{ person.name }}</h2>
    <ul class="person-roles">
      @for (role of person.roles; track role) {
        <li [class.coach]="role.toLowerCase() === 'coach'">{{ role }}</li>
      }
    </ul>

    <div class="person-bio" [class.clamped]="isLong && !expanded" [innerHTML]="person.longText"></div>
    @if (isLong) {
      <button mat-button type="button" class="bio-toggle" (click)="expanded = !expanded" [attr.aria-expanded]="expanded">
        {{ expanded ? 'Show less' : 'Read more' }}
        <mat-icon iconPositionEnd>{{ expanded ? 'expand_less' : 'expand_more' }}</mat-icon>
      </button>
    }
  </mat-card-content>

  @if (person.emailAddresses.length) {
    <div class="person-contact">
      @for (email of person.emailAddresses; track email) {
        <a [href]="'mailto:' + email">
          <mat-icon inline>mail_outline</mat-icon>
          <span>{{ email }}</span>
        </a>
      }
    </div>
  }
</mat-card>
