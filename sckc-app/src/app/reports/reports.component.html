<app-page-title title="Trip Reports"></app-page-title>

@if (!isReady) {
  <mat-spinner></mat-spinner>
}

@for (report of reports; track report) {
  <mat-expansion-panel>
    <mat-expansion-panel-header>
      {{ report.title }}
    </mat-expansion-panel-header>
    <ng-template matExpansionPanelContent>
      <app-trip-report [report]="report"></app-trip-report>
    </ng-template>
  </mat-expansion-panel>
}
