<div class="trip-report">
  <dl class="facts">
    @for (fact of facts; track fact.label) {
      @if (fact.value) {
        <div class="fact">
          <mat-icon>{{ fact.icon }}</mat-icon>
          <div>
            <dt>{{ fact.label }}</dt>
            <dd>{{ fact.value }}</dd>
          </div>
        </div>
      }
    }
  </dl>

  <div class="report-body" [innerHTML]="report.report"></div>

  <div class="report-footer">
    @if (report.author) {
      <span class="author">Written by {{ report.author }}</span>
    }
    @if (report.photos) {
      <a mat-stroked-button color="primary" [routerLink]="['/gallery', report.photos]">
        <mat-icon>photo_library</mat-icon>
        View photos
      </a>
    }
  </div>
</div>
