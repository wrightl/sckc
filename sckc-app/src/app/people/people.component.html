<app-page-title title="Club Officials"></app-page-title>

<div class="container">
  <div class="intro">
    <p>
      Our committee are all volunteers who paddle with the club. For general
      enquiries email
      <a href="mailto:enquiries@sheffieldcitykayakclub.co.uk"
        >enquiries&#64;sheffieldcitykayakclub.co.uk</a
      >, or contact one of the officials below directly.
    </p>
  </div>

  <div class="people-grid">
    @for (person of people; track person.name) {
      <app-person [person]="person"></app-person>
    }
  </div>
</div>
