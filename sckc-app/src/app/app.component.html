<div class="app-container">
  <mat-toolbar color="primary" class="toolbar">
    <a class="app-name" routerLink="/" aria-label="Sheffield City Kayak Club home">
      <span class="app-name-medium">Sheffield City Kayak Club</span>
      <span class="app-name-small">SCKC</span>
    </a>
    <div class="menu-buttons-centre app-menu-medium">
      <button mat-button routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">
        Home
      </button>
      <button mat-button routerLink="/about" routerLinkActive="active" ariaCurrentWhenActive="page">
        About
      </button>
      <button mat-button routerLink="/photos" routerLinkActive="active" ariaCurrentWhenActive="page">
        Gallery
      </button>
      <button mat-button routerLink="/activities" routerLinkActive="active" ariaCurrentWhenActive="page">
        Events
      </button>
      <button mat-button routerLink="/contactus" routerLinkActive="active" ariaCurrentWhenActive="page">
        Contact
      </button>
    </div>
    <div class="menu-buttons-centre app-menu-small">
      <button mat-button [matMenuTriggerFor]="menu">Menu</button>
      <mat-menu #menu="matMenu">
        <button mat-menu-item routerLink="/" routerLinkActive="active-menu-item" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">Home</button>
        <button mat-menu-item routerLink="/about" routerLinkActive="active-menu-item" ariaCurrentWhenActive="page">About</button>
        <button mat-menu-item routerLink="/photos" routerLinkActive="active-menu-item" ariaCurrentWhenActive="page">Gallery</button>
        <button mat-menu-item routerLink="/activities" routerLinkActive="active-menu-item" ariaCurrentWhenActive="page">Events</button>
        <button mat-menu-item routerLink="/contactus" routerLinkActive="active-menu-item" ariaCurrentWhenActive="page">Contact</button>
      </mat-menu>
    </div>
  </mat-toolbar>

  <main class="router-container">
    <router-outlet></router-outlet>
  </main>
  <app-footer></app-footer>
</div>
