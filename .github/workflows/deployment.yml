name: Main deployment workflow

on:
    workflow_call:
        inputs:
            env_type:
                required: true
                type: string
            deployment_path:
                required: true
                type: string
            deploy_api:
                description: Build and deploy the API. Staging only deploys the Angular app, which uses the production API.
                required: false
                type: boolean
                default: true
        secrets:
            google_calendar_creds:
                required: true
            ftphost:
                required: true
            ftpuser:
                required: true
            ftppassword:
                required: true
            resend_apikey:
                required: true
            stripe_apikey:
                required: true
jobs:
    # test api - runs even when the api isn't being deployed, so PRs are still checked
    api-tests:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup .NET
              uses: actions/setup-dotnet@v6
              with:
                  global-json-file: ./sckc/global.json

            - name: Test API
              working-directory: ./sckc
              run: dotnet test sckc.slnx -c Release

    # build api
    api:
        needs: api-tests
        if: ${{ inputs.deploy_api }}
        runs-on: windows-latest

        steps:
            # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup .NET
              uses: actions/setup-dotnet@v6
              with:
                  global-json-file: ./sckc/global.json

            - name: Publish API
              working-directory: ./sckc
              run: dotnet publish sckc.api/sckc.api.csproj -c Release -o sckc.api/deploy

            - name: Write secret files
              shell: pwsh
              env:
                  GOOGLE_CALENDAR_CREDS: ${{ secrets.google_calendar_creds }}
                  STRIPE_APIKEY: ${{ secrets.stripe_apikey }}
                  RESEND_APIKEY: ${{ secrets.resend_apikey }}
              run: |
                  $dataDir = Join-Path $PWD 'sckc/sckc.api/deploy/data'
                  New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
                  [IO.File]::WriteAllText((Join-Path $dataDir 'sckc.data'), $env:GOOGLE_CALENDAR_CREDS)
                  [IO.File]::WriteAllText((Join-Path $dataDir 'stripe_apikey.data'), $env:STRIPE_APIKEY)
                  [IO.File]::WriteAllText((Join-Path $dataDir 'resend_apikey.data'), $env:RESEND_APIKEY)

            - name: Upload Artifact
              uses: actions/upload-artifact@v7
              with:
                  name: published_api
                  path: ./sckc/sckc.api/deploy

    # build app
    angular-app:
        if: ${{ true }} # disable for now
        # The type of runner that the job will run on
        runs-on: ubuntu-latest

        # Steps represent a sequence of tasks that will be executed as part of the job
        steps:
            # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
            - uses: actions/checkout@v7

            - name: Setup Node.js environment
              uses: actions/setup-node@v7
              with:
                  node-version-file: ./sckc-app/.nvmrc

            - name: Install Dependencies
              working-directory: ./sckc-app
              #if:
              #  steps.cache-nodemodules.outputs.cache-hit != 'true'
              #  # 👆 if cache hits the skip this step.
              run: npm ci --loglevel verbose

            - name: Build
              working-directory: ./sckc-app
              run: npm run build:${{ inputs.env_type }}

            - name: Lint
              working-directory: ./sckc-app
              run: npm run lint

            - name: Test
              if: ${{ false }} # disable for now
              working-directory: ./sckc-app
              run: npm run test:${{ inputs.env_type }}

            - name: Upload Artifact
              uses: actions/upload-artifact@v7
              with:
                  name: published_app
                  path: ./sckc-app/dist/sckc-app
                  
    # deploy main webapp to host
    ftp:
        needs: [api-tests, angular-app, api]
        # still deploy when the api job was skipped (deploy_api: false), but never when the api tests failed
        if: ${{ !cancelled() && needs.api-tests.result == 'success' && needs.angular-app.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.api.result) }}
        # The type of runner that the job will run on
        runs-on: ubuntu-latest

        # Steps represent a sequence of tasks that will be executed as part of the job
        steps:
            - name: Download all workflow run artifacts
              uses: actions/download-artifact@v8

            - name: ftp-action-app
              uses: SamKirkland/FTP-Deploy-Action@v4.4.0
              with:
                  # FTP host
                  server: ${{ secrets.ftphost}}
                  # FTP user
                  username: ${{ secrets.ftpuser}}
                  # FTP password
                  password: ${{ secrets.ftppassword}}
                  # Folder to upload from, must end with trailing slash /
                  local-dir: /home/runner/work/sckc/sckc/published_app/
                  # Path to upload to on the server. Must end with trailing slash /
                  server-dir: ${{ inputs.deployment_path }}
                  # Path and name of the state file - this file is used to track which files have been deployed
                  state-name: .ftp-deploy-app-sync-state.json # optional
                  # How verbose should the information be - minimal, standard, or verbose
                  log-level: verbose # optional

            - name: ftp-action-api
              if: ${{ inputs.deploy_api }}
              uses: SamKirkland/FTP-Deploy-Action@v4.4.0
              with:
                  # FTP host
                  server: ${{ secrets.ftphost}}
                  # FTP user
                  username: ${{ secrets.ftpuser}}
                  # FTP password
                  password: ${{ secrets.ftppassword}}
                  # Folder to upload from, must end with trailing slash /
                  local-dir: /home/runner/work/sckc/sckc/published_api/
                  # Path to upload to on the server. Must end with trailing slash /
                  server-dir: ${{ inputs.deployment_path }}
                  # Path and name of the state file - this file is used to track which files have been deployed
                  state-name: .ftp-deploy-api-sync-state.json # optional
                  log-level: verbose

            - name: URL Health Check
              if: ${{ inputs.deploy_api }}
              env:
                  HEALTH_URL: ${{ format('http://www.sheffieldcitykayakclub.co.uk/{0}api/health', inputs.deployment_path) }}
              run: |
                  # The API returns the JSON string "Healthy". Check the body, not just the status code: the
                  # site's SPA fallback answers unknown paths with index.html and a 200.
                  for attempt in 1 2 3; do
                      body=$(curl -s --max-time 30 "$HEALTH_URL" || true)
                      if [ "$body" = '"Healthy"' ]; then
                          echo "Health check passed: $HEALTH_URL"
                          exit 0
                      fi
                      echo "Attempt $attempt: unexpected response from $HEALTH_URL: $(printf '%s' "$body" | tr -s '\n' ' ' | cut -c1-150)"
                      [ "$attempt" -lt 3 ] && sleep 30
                  done
                  echo "::error::Health check failed for $HEALTH_URL"
                  exit 1

            - name: App Check
              env:
                  APP_URL: ${{ format('http://www.sheffieldcitykayakclub.co.uk/{0}index.html', inputs.deployment_path) }}
                  BASE_HREF: ${{ format('<base href="/{0}"', inputs.deployment_path) }}
              run: |
                  # Make sure the Angular build for this environment (identified by its base href) was deployed
                  for attempt in 1 2 3; do
                      body=$(curl -s --max-time 30 "$APP_URL" || true)
                      if [[ "$body" == *"$BASE_HREF"* ]]; then
                          echo "App check passed: $APP_URL"
                          exit 0
                      fi
                      echo "Attempt $attempt: $APP_URL did not contain $BASE_HREF"
                      [ "$attempt" -lt 3 ] && sleep 30
                  done
                  echo "::error::App check failed for $APP_URL"
                  exit 1

    cleanup:
        needs: [angular-app, api, ftp]
        if: always()
        # The type of runner that the job will run on
        runs-on: ubuntu-latest
        steps:

            - name: Delete Artifacts
              uses: GeekyEggo/delete-artifact@v6
              with:
                  # The name of the artifact to delete; multiple names can be supplied on new lines.
                  name: |
                      published_api
                      published_app
                  # Indicates whether the action should fail upon encountering an error.
                  failOnError: false # optional, default is true
