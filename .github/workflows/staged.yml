name: PR Staged CI

# Controls when the workflow will run
on:
    # Triggers the workflow on push or pull request events but only for the master branch
    pull_request:
        branches: [master]

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

jobs:
    deploy-staged:
        uses: ./.github/workflows/deployment.yml
        with:
            env_type: staged
            deployment_path: app/
            # The host can't run a second API under app/, so staging uses the production API
            deploy_api: false
        secrets:
            google_calendar_creds: ${{ secrets.google_calendar_creds }}
            ftphost: ${{ secrets.ftphost }}
            ftpuser: ${{ secrets.ftpuser }}
            ftppassword: ${{ secrets.ftppassword }}
            resend_apikey: ${{ secrets.resend_apikey }}
            stripe_apikey: ${{ secrets.stripe_apikey_test }}
